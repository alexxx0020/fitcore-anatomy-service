services:
  postgres:
    image: postgres:16-alpine
    container_name: anatomy-postgres
    environment:
      POSTGRES_USER: fitcore
      POSTGRES_PASSWORD: fitcore123
      POSTGRES_DB: fitcore_anatomy
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: